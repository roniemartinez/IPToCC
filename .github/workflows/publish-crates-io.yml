name: Publish to crates.io

on:
  push:
    tags:
      - 'rust-v*'
      - 'all-v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish iptocc to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: stable
      - name: Authenticate to crates.io
        uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - name: Publish iptocc
        working-directory: crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
